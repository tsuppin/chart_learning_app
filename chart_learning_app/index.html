<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>めくり</title>
    <meta name="description" content="相場師朗流のチャートめくり練習ツール。ローソク足を1本ずつめくって売買判断を鍛えましょう。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>

<body class="light-theme">
    <div class="app-container">


        <main>
            <div class="canvas-container">
                <canvas id="chartCanvas"></canvas>
                <div id="overlay-message" class="overlay-message">
                    <div class="upload-prompt">
                        <span class="upload-icon">📊</span>
                        <p>チャート画像をアップロードしてください</p>
                        <p class="upload-hint">ローソク足チャートの画像を選択すると練習を開始できます</p>
                    </div>
                </div>
            </div>

            <aside class="control-panel">
                <div class="panel-grid">

                <div class="actions actions-grid-4">
                    <label for="chartUpload" class="upload-btn">
                        フォルダ
                        <input type="file" id="chartUpload" webkitdirectory class="file-input">
                    </label>
                    <label for="imageUpload" class="upload-btn upload-btn-secondary">
                        画像
                        <input type="file" id="imageUpload" accept="image/*" multiple class="file-input">
                    </label>
                    <button id="prevDayBtn" disabled>前</button>
                    <button id="nextDayBtn" disabled>次</button>
                </div>

                <div class="actions actions-grid-4">
                    <button id="autoRewindBtn" disabled>もどり</button>
                    <button id="autoPlayBtn" disabled>めくり</button>
                    <button id="loopFolderBtn" class="secondary loop-btn" disabled title="読み込んだ全画像を繰り返し自動めくり">
                        全リピ</button>
                    <button id="loopImageBtn" class="secondary loop-btn" disabled title="読み込んだ全画像を繰り返し自動めくり">
                        画リピ</button>
                </div>

                <div class="panel-scroll-area">
                <div class="status-panel">
                        <div id="imageNavArea" class="image-nav-area status-nav-row">
                            <button id="prevImageBtn" class="nav-img-btn" title="前の画像">◀</button>
                            <span id="imageIndexLabel" class="image-nav-label">1/1</span>
                            <button id="nextImageBtn" class="nav-img-btn" title="次の画像">▶</button>
                        </div>

                        <div class="status-header-row">
                            <button id="maskResetBtn" class="mask-btn-wide" disabled>M戻す</button>
                            <button id="maskRevealBtn" class="mask-btn-wide" disabled>Mめくる</button>

                            <div class="step-display">
                                <span id="currentStep" class="step-number">0</span>
                                <button id="resetCurrentBtn" class="small-btn" title="この画像をリセット" disabled>↺</button>
                            </div>

                            <div class="autoplay-speed-ctrl inline-speed">
                                <button id="speedDecBtn" class="small-btn">−</button>
                                <input type="number" id="speedValueInput" value="0.6" min="0.1" max="2.0" step="0.1" readonly title="自動再生間隔 (秒)">
                                <button id="speedIncBtn" class="small-btn">+</button>
                            </div>
                        </div>

                    <div class="settings-row">
                        <div class="setting-group">
                            <label for="stepSizeInput">送り幅</label>
                            <div class="step-control">
                                <button id="stepDec" class="small-btn">−</button>
                                <input type="number" id="stepSizeInput" value="23" min="1" max="200">
                                <button id="stepInc" class="small-btn">+</button>
                            </div>
                        </div>

                        <div class="setting-group">
                            <label for="zoomLevelInput">ズーム</label>
                            <div class="step-control">
                                <button id="zoomOut" class="small-btn">−</button>
                                <input type="number" id="zoomLevelInput" value="100" min="20" max="500" step="10">
                                <button id="zoomIn" class="small-btn">+</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="input-group paint-group">
                    <h3>🎨 ペイント (予測線)</h3>
                    <div class="color-palette" id="colorPalette">
                        <button class="color-btn bg-red" data-color="#ef4444" title="赤"></button>
                        <button class="color-btn bg-green" data-color="#22c55e" title="緑"></button>
                        <button class="color-btn bg-blue" data-color="#3b82f6" title="青"></button>
                        <button class="color-btn bg-purple" data-color="#a855f7" title="紫"></button>
                        <button class="color-btn bg-orange" data-color="#f97316" title="オレンジ"></button>
                        <button class="color-btn bg-yellow" data-color="#eab308" title="黄"></button>
                        <button class="color-btn border-btn bg-white" data-color="#ffffff" title="白"></button>
                        <button class="color-btn active" data-color="" title="ペイントオフ">🚫</button>
                    </div>
                    <button id="clearPaintBtn" class="secondary clear-paint-btn">🗑️ ペイントを消去</button>
                </div>

                <!-- Candle Width Calibration -->
                <div class="calibration-section">
                    <h3>📏 ローソク足キャリブレーション</h3>
                    <button id="calibrateBtn" class="calibrate-btn" disabled>📏 ローソク足幅を計測</button>
                    <div id="calibrateStatus" class="calibrate-status"></div>
                </div>

                <!-- Price Axis Calibration -->
                <div class="calibration-section price-cal">
                    <h3>💰 価格キャリブレーション</h3>
                    <button id="priceCalibrateBtn" class="calibrate-btn price-cal-btn" disabled>💰 価格軸を設定</button>
                    <button id="autoCalibrateBtn" class="calibrate-btn auto-cal-btn auto-cal-margin" disabled>🤖
                        自動キャリブレーション (画像から数値取得)</button>
                    <div id="priceCalibrateStatus" class="calibrate-status"></div>
                    <div class="price-read-toggle">
                        <label class="toggle-label" for="priceReadModeToggle">
                            <input type="checkbox" id="priceReadModeToggle" disabled>
                            <span class="toggle-slider"></span>
                            <span class="toggle-text">🖱️ クリックで株価読取</span>
                        </label>
                    </div>
                </div>

                <!-- 株価・建玉セクション -->
                <div class="input-group stockprice-group">
                    <h3>💹 株価・建玉</h3>

                    <div class="price-input-container">
                        <label for="currentPrice">現在株価</label>
                        <input type="number" id="currentPrice" placeholder="クリックで自動入力">
                    </div>

                    <div class="position-inputs vertical">
                        <div class="input-wrapper red">
                            <label for="sellPos">🔴 売</label>
                            <input type="number" id="sellPos" value="0" min="0">
                        </div>
                        <div class="input-wrapper blue">
                            <label for="buyPos">🔵 買</label>
                            <input type="number" id="buyPos" value="0" min="0">
                        </div>
                    </div>
                </div>

                <!-- 損益パネル -->
                <div class="pl-panel">
                    <h3>📊 損益</h3>

                    <!-- 建値情報 -->
                    <div class="entry-prices" id="entryPricesSection">
                        <div class="entry-price-row hidden" id="sellEntryRow">
                            <span class="entry-label">🔴 売り建値</span>
                            <span class="entry-value" id="avgSellPriceDisplay">-</span>
                        </div>
                        <div class="entry-price-row hidden" id="buyEntryRow">
                            <span class="entry-label">🔵 買い建値</span>
                            <span class="entry-value" id="avgBuyPriceDisplay">-</span>
                        </div>
                    </div>

                    <!-- 含み損益の詳細 -->
                    <div class="pl-detail-section" id="plDetailSection">
                        <div class="pl-detail-row hidden" id="sellPLRow">
                            <span>売り含み</span>
                            <span id="sellUnrealizedPL" class="pl-val">0</span>
                        </div>
                        <div class="pl-detail-row hidden" id="buyPLRow">
                            <span>買い含み</span>
                            <span id="buyUnrealizedPL" class="pl-val">0</span>
                        </div>
                    </div>

                    <!-- メイン損益表示 -->
                    <div class="pl-main">
                        <div class="pl-item">
                            <span>含み損益</span>
                            <span id="unrealizedPL" class="pl-val-big">0</span>
                        </div>
                        <div class="pl-item">
                            <span>確定損益</span>
                            <span id="realizedPL" class="pl-val-big">0</span>
                        </div>
                        <div class="pl-total">
                            <span>合計損益</span>
                            <span id="totalPL" class="pl-val-total">0</span>
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <h3>🏷️ 技タグ (任意)</h3>
                    <select id="techniqueTag" aria-label="技タグ">
                        <option value="">なし</option>
                        <option value="下半身">下半身</option>
                        <option value="逆下半身">逆下半身</option>
                        <option value="もの別れ">もの別れ</option>
                        <option value="N大">N大</option>
                        <option value="逆N大">逆N大</option>
                        <option value="高校生タイム">高校生タイム</option>
                        <option value="9の法則">9の法則</option>
                        <option value="7の法則">7の法則</option>
                        <option value="トライ届かず">トライ届かず</option>
                    </select>
                </div>

                <div class="history-log">
                    <h3>📋 履歴</h3>
                    <ul id="historyList"></ul>
                </div>
                </div> <!-- /.panel-scroll-area -->

                </div><!-- /.panel-grid -->
            </aside>
        </main>
    </div>
    <script src="script.js?v=24"></script>
</body>

</html>
